name: JMA amedas 1h Data Convert to UTF-8

on: [schedule, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: run code
      run: python convert_1h.py

    - name: save file
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add jma_latest_utf8.csv
        git diff-index --quiet HEAD || (git commit -m "Update JMA data" && git push)
