yaml
name: JMA Data Convert to UTF-8

on:
  schedule:
    # 1時間に1回、毎時15分に自動実行（気象庁のデータ更新タイミングに合わせる）
    - cron: '15 * * * *'
  workflow_dispatch: # 手動でいつでも動かせるようにするボタン

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHubにファイルを書き込む権限

    steps:
    - name: レポジトリをチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 変換プログラムの実行
      run: python convert.py

    - name: 変換したCSVをGitHubに上書き保存
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add jma_latest_utf8.csv
        git diff-index --quiet HEAD || git commit -m "Update JMA latest data (UTF-8)"
        git push
